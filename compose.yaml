services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: 'locadora-postgres'
    environment:
      - 'POSTGRES_DB=locadora'
      - 'POSTGRES_USER=locadora'
      - 'POSTGRES_PASSWORD=locadora'
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U locadora -d locadora']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
