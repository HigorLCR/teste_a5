spring:
  application:
    name: locadora

  # NAO ha bloco 'datasource' aqui de proposito.
  # A dependencia spring-boot-docker-compose le o compose.yaml, sobe o container
  # do Postgres e injeta url/usuario/senha automaticamente. Menos configuracao
  # duplicada e impossivel dessincronizar os dois arquivos.

  jpa:
    # Nao mantem a sessao do banco aberta durante a renderizacao da resposta.
    # O default 'true' MASCARA o problema de N+1 queries; desligar expoe o erro
    # cedo, na sua cara, em vez de virar lentidao em producao.
    open-in-view: false
    hibernate:
      # 'validate' = o Hibernate apenas CONFERE se as entidades batem com as
      # tabelas. Quem cria/altera tabela e o Flyway (SQL versionado em
      # src/main/resources/db/migration). Jamais use 'update' em projeto serio:
      # ele altera schema por adivinhacao e nao deixa historico.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  threads:
    virtual:
      # Virtual threads do Java 21: cada request roda em uma thread virtual,
      # baratissima. Ganho direto de throughput em API que espera I/O (banco).
      enabled: true

# Endpoints de monitoramento do Actuator.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      # Mostra os componentes checados (inclusive o banco) em /actuator/health.
      # Em producao isso vira 'when-authorized' — expoe detalhes de infra.
      show-details: always

logging:
  level:
    # Imprime o SQL que o Hibernate gera. Otimo para aprender o que o JPA faz
    # por baixo e para caçar N+1. Depois mova para um profile 'dev'.
    org.hibernate.SQL: debug
