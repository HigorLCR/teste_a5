server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: locadora

  # Sem bloco 'datasource': a dependencia spring-boot-docker-compose le o
  # compose.yaml, sobe o Postgres e injeta a conexao.

  jpa:
    open-in-view: false
    hibernate:
      # O schema pertence ao Flyway; o Hibernate apenas confere.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: debug

locadora:
  jwt:
    # Em producao JWT_SEGREDO e obrigatorio: quem tem o segredo forja tokens.
    # HS256 exige no minimo 256 bits (32 caracteres).
    segredo: ${JWT_SEGREDO:desenvolvimento-godzilla-local-filmes-chave-hmac-nao-usar-em-producao}
    duracao-minutos: ${JWT_DURACAO_MINUTOS:120}
